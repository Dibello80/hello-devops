
name: Java Docker CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - '.github/workflows/ci.yml'

  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and test application
        run: ./mvnw clean package

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/dibello80/hello-devops:latest .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push ghcr.io/dibello80/hello-devops:latest

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-1

      - name: Deploy to EC2 with SSM
        if: github.event_name == 'push'
        run: |
          aws ssm send-command \
            --instance-ids "i-0c77da5912a6b7f75" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo docker pull ghcr.io/dibello80/hello-devops:latest",
              "sudo docker rm -f hello-devops || true",
              "sudo docker run -d --restart unless-stopped --name hello-devops -p 80:8080 ghcr.io/dibello80/hello-devops:latest"
            ]'
