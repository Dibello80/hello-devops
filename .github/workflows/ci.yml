
name: Java Docker CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - 'deploy/**'
      - '.github/workflows/ci.yml'

  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - 'deploy/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    concurrency:
      group: hello-devops-${{ github.event_name == 'push' && 'production' || github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Get source code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and test application
        run: ./mvnw clean package

      - name: Validate deployment script
        run: bash -n deploy/deploy.sh

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/dibello80/hello-devops:latest .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push ghcr.io/dibello80/hello-devops:latest

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-1

      - name: Deploy to EC2 with SSM
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          ENCODED_SCRIPT=$(base64 -w 0 deploy/deploy.sh)

          jq -n --arg script "$ENCODED_SCRIPT" \
            '{commands: [
              ("echo " + $script + " | base64 -d > /tmp/hello-devops-deploy.sh"),
              "sed -i 's/\r$//' /tmp/hello-devops-deploy.sh",
              "bash /tmp/hello-devops-deploy.sh"
            ]}' > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c77da5912a6b7f75" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0c77da5912a6b7f75"; then

            echo "Remote deployment failed."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0c77da5912a6b7f75" \
              --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
              --output json

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0c77da5912a6b7f75" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

      - name: Verify application health
        if: github.event_name == 'push'
        run: |
          echo "Checking application health..."

          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 5 \
              https://devops.dibellointeractive.com/; then
              echo ""
              echo "Application is healthy!"
              exit 0
            fi

            echo "Attempt $attempt failed. Retrying in 5 seconds..."
            sleep 5
          done

          echo "Application health check failed."
          exit 1
