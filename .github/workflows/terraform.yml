name: Terraform Validation and Plan

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-state
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.2'

      - name: Check Terraform formatting
        run: terraform fmt -check

      - name: Initialize without backend
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

      - name: Configure AWS credentials with OIDC
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::200359303675:role/GitHubTerraformPlanRole
          aws-region: us-west-1

      - name: Initialize S3 backend
        if: github.event_name == 'push'
        run: terraform init -reconfigure -input=false

      - name: Run Terraform Plan
        if: github.event_name == 'push'
        run: terraform plan -input=false -no-color -lock-timeout=5m